name: Update profile stats

on:
  schedule:
    # Every six hours, offset from the hour so it misses the public cron spike.
    - cron: "20 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/update-stats.yml"
      - ".github/scripts/generate_profile.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw profile charts
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python3 .github/scripts/generate_profile.py

      - name: Commit charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          if git diff --cached --quiet; then
            echo "No chart changes"
            exit 0
          fi
          git commit -m "chore: refresh profile stats"
          for i in 1 2 3; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "Push rejected, retry $i"
            git pull --rebase origin master
            sleep 3
          done
          exit 1
